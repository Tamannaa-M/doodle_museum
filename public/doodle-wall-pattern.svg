    <g transform="translate(360, 660)">
      <path d="M10 15 l6 40 c2 12 34 12 36 0 l6 -40 Z"/>
      <path d="M52 24 c10 0 10 20 0 20"/>
      <path d="M22 6 q5-10 0-16 m10 16 q5-10 0-16"/>
