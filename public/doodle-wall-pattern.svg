      <path d="M20 -2 a12 12 0 0 1 0 22 a12 12 0 0 1 -22 0 a12 12 0 0 1 22 -22"/>
      <path d="M20 20 a12 12 0 0 1 22 0 a12 12 0 0 1 -22 0 a12 12 0 0 1 0 -22"/>
      <path d="M20 20 a12 12 0 0 1 0 22 a12 12 0 0 1 -22 0 a12 12 0 0 1 22 -22"/>
      <path d="M20 20 a12 12 0 0 1 -22 0 a12 12 0 0 1 0 -22 a12 12 0 0 1 22 22"/>
    </g>
