    <!-- Double Note ♫ -->
    <g transform="translate(680, 240)">
      <ellipse cx="20" cy="40" rx="8" ry="6" transform="rotate(-20 20 40)" fill="#161616"/>
      <ellipse cx="55" cy="30" rx="8" ry="6" transform="rotate(-20 55 30)" fill="#161616"/>
      <path d="M26 38 l0 -32 l35 -10 l0 32 m-35 -24 l35 -10" stroke-width="3"/>
