    <!-- 1. BIG DOODLE GIRL WITH BANGS & BRAIDS (From User Notebook) -->
    <g transform="translate(600, 60)">
      <!-- Face contour -->
      <path d="M40 70 c0-35 45-50 80-50 c45 0 80 15 80 50 c0 45-25 75-80 75 c-55 0-80-30-80-75 Z"/>
